services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5241:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/app/data/scholarship.db"
      Jwt__Key: "${JWT_KEY:-CHANGE-THIS-TO-A-SECURE-RANDOM-KEY-IN-PRODUCTION}"
      Jwt__Issuer: ScholarshipPortal
      Jwt__Audience: ScholarshipPortal
      Jwt__ExpiryHours: "24"
      Storage__UploadRoot: /app/uploads
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5180"
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend/scholarship-portal-web
      dockerfile: Dockerfile
      args:
        # Baked fallback only; runtime uses window.location.origin (http://localhost:3000)
        VITE_APP_ORIGIN: http://localhost:3000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
